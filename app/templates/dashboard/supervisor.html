{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
  <div class="border-b border-gray-200 pb-4">
    <h1 class="text-2xl font-bold text-gray-800">{{ t('transport_supervisor', current_lang(request)|default='Transport Supervisor') }}</h1>
    <p class="text-gray-600 text-sm">Review requests requiring your approval</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="bg-white shadow rounded-xl border border-gray-200 p-5">
      <p class="text-xs font-semibold text-gray-500 uppercase">Pending review</p>
      <p class="text-3xl font-bold text-yellow-600">{{ pending }}</p>
    </div>
  </div>

  <div class="bg-white shadow rounded-xl border border-gray-200 p-6">
    <h3 class="text-sm font-semibold text-gray-700 mb-4">Requests awaiting approval</h3>
    <div class="text-center py-8 text-gray-500"><p>Coming in the full approvals module.</p></div>
  </div>
</div>
{% endblock %}
