{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto"><div class="bg-white shadow rounded-xl border border-gray-200 p-6"><h2 class="text-lg font-bold text-gray-800 mb-4">{{ page_title }}</h2><form method="post" action="/inspections/create" class="space-y-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div><label class="block text-sm font-medium text-gray-700 mb-1">Vehicle <span class="text-red-500">*</span></label><select name="vehicle_id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="">Select</option>{% for v in vehicles %}<option value="{{ v.id }}">{{ v.registration_number }}</option>{% endfor %}</select></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Driver</label><select name="driver_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="">None</option>{% for d in drivers %}<option value="{{ d.id }}">{{ d.employee.full_name if d.employee else d }}</option>{% endfor %}</select></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Type <span class="text-red-500">*</span></label><select name="inspection_type" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="before_trip">Before trip</option><option value="after_trip">After trip</option></select></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Checklist (JSON)</label><input name="checklist" value="{}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Defects</label><input name="defects" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Odometer reading</label><input name="odometer_reading" type="number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Fuel level</label><input name="fuel_level" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Passed</label><select name="passed" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="true">Yes</option><option value="false">No</option></select></div>
</div>
<div class="flex justify-end gap-3 pt-6 border-t border-gray-200"><a href="/inspections/" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Cancel</a><button type="submit" class="bg-tbc-blue text-white px-4 py-2 rounded-lg hover:bg-tbc-blue/90 transition">Record inspection</button></div>
</form></div></div></div>
{% endblock %}
