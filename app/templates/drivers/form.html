{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="bg-white shadow rounded-xl border border-gray-200 p-6">
    <h2 class="text-lg font-bold text-gray-800 mb-4">{{ page_title }}</h2>
    <form method="post" action="{% if driver %}/drivers/{{ driver.id }}/update{% else %}/drivers/create{% endif %}" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Employee <span class="text-red-500">*</span></label>
        <select name="employee_id" required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
          <option value="">Select employee</option>
          {% for e in employees %}
          <option value="{{ e.id }}" {% if driver and driver.employee_id==e.id %}selected{% endif %}>
            {{ e.full_name }} ({{ e.employee_number }})
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Licence number <span class="text-red-500">*</span></label>
          <input name="licence_number" required value="{{ driver.licence_number if driver else '' }}"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Licence category <span class="text-red-500">*</span></label>
          <select name="licence_category" required
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
            <option value="B" {% if not driver or driver.licence_category=='B' %}selected{% endif %}>B</option>
            <option value="C" {% if driver and driver.licence_category=='C' %}selected{% endif %}>C</option>
            <option value="D" {% if driver and driver.licence_category=='D' %}selected{% endif %}>D</option>
            <option value="E" {% if driver and driver.licence_category=='E' %}selected{% endif %}>E</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Licence expiry</label>
          <input name="licence_expiry" type="date"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Availability</label>
          <select name="availability"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
            <option value="available" {% if not driver or driver.availability=='available' %}selected{% endif %}>Available</option>
            <option value="on_duty" {% if driver and driver.availability=='on_duty' %}selected{% endif %}>On duty</option>
            <option value="on_leave" {% if driver and driver.availability=='on_leave' %}selected{% endif %}>On leave</option>
            <option value="unavailable" {% if driver and driver.availability=='unavailable' %}selected{% endif %}>Unavailable</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Shift info</label>
        <input name="shift_info" value="{{ driver.shift_info if driver else '' }}"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"
          placeholder="e.g. Day shift 06:00-18:00">
      </div>
      <div class="flex items-center gap-2">
        <input name="is_active" type="checkbox" value="true" {% if not driver or driver.is_active %}checked{% endif %}
          class="rounded bg-gray-300 border-gray-300 focus:ring-tbc-blue">
        <label class="text-sm text-gray-700">Active</label>
      </div>
      <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
        <a href="/drivers/" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Cancel</a>
        <button type="submit" class="bg-tbc-blue text-white px-4 py-2 rounded-lg hover:bg-tbc-blue/90 transition">Save driver</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
