{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="bg-white shadow rounded-xl border border-gray-200 p-6">
    <h2 class="text-lg font-bold text-gray-800 mb-4">{{ page_title }}</h2>
    <form method="post" action="{% if employee %}/employees/{{ employee.id }}/update{% else %}/employees/create{% endif %}" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Employee number</label>
          <input name="employee_number" required value="{{ employee.employee_number if employee else '' }}"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">First name</label>
          <input name="first_name" required value="{{ employee.first_name if employee else '' }}"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Last name</label>
          <input name="last_name" required value="{{ employee.last_name if employee else '' }}"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input name="email" type="email" value="{{ employee.email if employee else '' }}"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
          <input name="phone" value="{{ employee.phone if employee else '' }}"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Directorate</label>
          <select name="directorate_id" id="directorate_id"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
            <option value="">Select</option>
            {% for d in directorates %}
            <option value="{{ d.id }}" {% if employee and employee.directorate_id==d.id %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
          <select name="department_id" id="department_id"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
            <option value="">Select</option>
            {% for d in departments %}
            <option value="{{ d.id }}" {% if employee and employee.department_id==d.id %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Section</label>
          <select name="section_id"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
            <option value="">Select</option>
            {% for s in sections %}
            <option value="{{ s.id }}" {% if employee and employee.section_id==s.id %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="md:grid md:grid-cols-2 md:gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <select name="is_active"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
            <option value="true" {% if not employee or employee.is_active %}selected{% endif %}>Active</option>
            <option value="false" {% if employee and not employee.is_active %}selected{% endif %}>Inactive</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
        <a href="/employees/" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Cancel</a>
        <button type="submit" class="bg-tbc-blue text-white px-4 py-2 rounded-lg hover:bg-tbc-blue/90 transition">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
