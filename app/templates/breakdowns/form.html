{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto"><div class="bg-white shadow rounded-xl border border-gray-200 p-6"><h2 class="text-lg font-bold text-gray-800 mb-4">{{ page_title }}</h2><form method="post" action="/breakdowns/create" class="space-y-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div><label class="block text-sm font-medium text-gray-700 mb-1">Vehicle <span class="text-red-500">*</span></label><select name="vehicle_id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="">Select</option>{% for v in vehicles %}<option value="{{ v.id }}">{{ v.registration_number }}</option>{% endfor %}</select></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Driver</label><select name="driver_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="">None</option>{% for d in drivers %}<option value="{{ d.id }}">{{ d.employee.full_name if d.employee else d }}</option>{% endfor %}</select></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Location <span class="text-red-500">*</span></label><input name="location" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Date/time <span class="text-red-500">*</span></label><input name="breakdown_datetime" type="datetime-local" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Nature <span class="text-red-500">*</span></label><input name="nature" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div class="md:col-span-2"><label class="block text-sm font-medium text-gray-700 mb-1">Description</label><textarea name="description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></textarea></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Passengers safe</label><select name="passengers_safe" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="true">Yes</option><option value="false">No</option></select></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Towing required</label><select name="towing_required" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="false">No</option><option value="true">Yes</option></select></div>
</div>
<div class="flex justify-end gap-3 pt-6 border-t border-gray-200"><a href="/breakdowns/" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Cancel</a><button type="submit" class="bg-tbc-blue text-white px-4 py-2 rounded-lg hover:bg-tbc-blue/90 transition">Report breakdown</button></div>
</form></div></div></div>
{% endblock %}
