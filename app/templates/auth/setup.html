{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-10">
  <div class="bg-white shadow rounded-lg border border-gray-200 p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="bg-tbc-blue p-2 rounded-lg"><i class="fas fa-cog text-white"></i></div>
      <h2 class="text-xl font-bold text-gray-800">System setup</h2>
    </div>
    <p class="text-gray-600 mb-6">Create the first system administrator account to initialise TBC-FTMS.</p>
    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input name="username" type="text" required value="admin"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input name="email" type="email" required value="admin@tbc.go.tz"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input name="password" type="password" required value="Admin123!"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Full name</label>
        <input name="full_name" type="text" required value="System Administrator"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none">
      </div>
      <button type="submit"
        class="w-full bg-tbc-blue text-white font-semibold py-3 rounded-lg hover:bg-tbc-blue/90 transition">
        Initialise system
      </button>
    </form>
    <p class="mt-6 text-xs text-gray-500 text-center">
      Demo credentials: admin / Admin123!
    </p>
  </div>
</div>
{% endblock %}
