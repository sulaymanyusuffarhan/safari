{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-200 pb-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Organisational structure</h1>
      <p class="text-gray-600 text-sm">Directorates, departments and sections</p>
    </div>
  </div>
  <div class="bg-white shadow rounded-xl border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500 sticky top-0"><tr><th class="px-4 py-2 text-left">Name</th><th class="px-4 py-2 text-left">Code</th><th class="px-4 py-2 text-left">Status</th></tr></thead>
        <tbody class="divide-y divide-gray-100">
        {% for d in dirs %}
        <tr><td class="px-4 py-3">{{ d.name }}</td><td class="px-4 py-3 font-mono text-xs">{{ d.code }}</td><td class="px-4 py-3"><span class="status-badge bg-{{ 'active' if d.is_active else 'inactive' }}">{{ 'Active' if d.is_active else 'Inactive' }}</span></td></tr>
        {% else %}
        <tr><td colspan="3" class="px-4 py-8 text-center text-gray-500">No directorates</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
