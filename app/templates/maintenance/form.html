{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto"><div class="bg-white shadow rounded-xl border border-gray-200 p-6"><h2 class="text-lg font-bold text-gray-800 mb-4">{{ page_title }}</h2><form method="post" action="/maintenance/create" class="space-y-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div><label class="block text-sm font-medium text-gray-700 mb-1">Vehicle <span class="text-red-500">*</span></label><select name="vehicle_id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="">Select</option>{% for v in vehicles %}<option value="{{ v.id }}">{{ v.registration_number }}</option>{% endfor %}</select></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Category</label><select name="category_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="">Select</option>{% for c in cats %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Reported problem <span class="text-red-500">*</span></label><input name="reported_problem" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Date reported</label><input name="date_reported" type="date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Mileage</label><input name="mileage" type="number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Workshop / mechanic</label><input name="assigned_mechanic_workshop" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Estimated cost (TZS)</label><input name="estimated_cost" type="number" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Actual cost (TZS)</label><input name="actual_cost" type="number" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
<div><label class="block text-sm font-medium text-gray-700 mb-1">Status</label><select name="status" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="reported">Reported</option><option value="approved">Approved</option><option value="in_progress">In progress</option><option value="completed">Completed</option></select></div>
</div>
<div class="flex justify-end gap-3 pt-6 border-t border-gray-200"><a href="/maintenance/" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Cancel</a><button type="submit" class="bg-tbc-blue text-white px-4 py-2 rounded-lg hover:bg-tbc-blue/90 transition">Save</button></div>
</form></div></div></div>
{% endblock %}
