{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
  <div class="border-b border-gray-200 pb-4"><h1 class="text-2xl font-bold text-gray-800">Reports &amp; analytics</h1><p class="text-gray-600 text-sm">Transport reports and data exports</p></div>
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div class="bg-white shadow rounded-xl border border-gray-200 p-5"><p class="text-xs font-semibold text-gray-500 uppercase">Total requests</p><p class="text-3xl font-bold text-gray-800">{{ total }}</p></div>
    <div class="bg-white shadow rounded-xl border border-gray-200 p-5"><p class="text-xs font-semibold text-gray-500 uppercase">Approved</p><p class="text-3xl font-bold text-green-600">{{ approved }}</p></div>
    <div class="bg-white shadow rounded-xl border border-gray-200 p-5"><p class="text-xs font-semibold text-gray-500 uppercase">Rejected</p><p class="text-3xl font-bold text-red-500">{{ rejected }}</p></div>
    <div class="bg-white shadow rounded-xl border border-gray-200 p-5"><p class="text-xs font-semibold text-gray-500 uppercase">Pending</p><p class="text-3xl font-bold text-yellow-600">{{ pending }}</p></div>
  </div>
  <div class="bg-white shadow rounded-xl border border-gray-200 p-6">
    <h3 class="text-sm font-semibold text-gray-700 mb-4">Export</h3>
    <p class="text-sm text-gray-600 mb-4">Download transport request data as CSV.</p>
    <a href="/reports/export/requests.csv" class="bg-tbc-blue text-white px-4 py-2 rounded-lg hover:bg-tbc-blue/90 transition inline-flex items-center gap-2"><i class="fas fa-file-csv"></i> Export requests CSV</a>
  </div>
</div>
{% endblock %}
