{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="bg-white shadow rounded-xl border border-gray-200 p-6">
    <h2 class="text-lg font-bold text-gray-800 mb-4">{{ page_title }}</h2>
    <form method="post" action="/fuel/create" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Vehicle <span class="text-red-500">*</span></label><select name="vehicle_id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="">Select</option>{% for v in vehicles %}<option value="{{ v.id }}">{{ v.registration_number }}</option>{% endfor %}</select></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Driver</label><select name="driver_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="">None</option>{% for d in drivers %}<option value="{{ d.id }}">{{ d.employee.full_name if d.employee else d }}</option>{% endfor %}</select></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Fuel type</label><select name="fuel_type_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"><option value="">Select</option>{% for ft in fuel_types %}<option value="{{ ft.id }}">{{ ft.name }}</option>{% endfor %}</select></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Quantity (litres) <span class="text-red-500">*</span></label><input name="quantity" type="number" step="0.01" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Unit price (TZS)</label><input name="unit_price" type="number" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Date</label><input name="transaction_date" type="date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Station / supplier</label><input name="fuel_station_supplier" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Odometer reading</label><input name="odometer_reading" type="number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Issue reference</label><input name="issue_reference" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Trip</label><input name="trip_id" type="number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tbc-blue focus:outline-none"></div>
      </div>
      <div class="flex justify-end gap-3 pt-6 border-t border-gray-200"><a href="/fuel/" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Cancel</a><button type="submit" class="bg-tbc-blue text-white px-4 py-2 rounded-lg hover:bg-tbc-blue/90 transition">Record fuel</button></div>
    </form>
  </div>
</div>
{% endblock %}
